<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <title>Una Pa' La Sed | Licorería premium</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root{--black:#090908;--surface:#15140f;--gold:#f6c745;--cream:#fff4d7;--muted:#b8af9a;--line:#4a3d19}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:#fff;font-family:'DM Sans',sans-serif;background:radial-gradient(circle at 84% 15%,rgba(246,199,69,.17),transparent 28%),linear-gradient(120deg,rgba(0,0,0,.75),rgba(0,0,0,.86)),url('Imagenes/promo-premium.jpg') center/cover no-repeat;display:flex;flex-direction:column}.top{display:flex;align-items:center;justify-content:space-between;padding:23px clamp(24px,7vw,100px);border-bottom:1px solid rgba(246,199,69,.2)}.brand{display:flex;gap:12px;align-items:center;color:var(--gold);font-family:'Playfair Display',serif;font-weight:700}.brand-icon{width:40px;height:45px;background:url('Imagenes/neins-logo.svg') center/contain no-repeat}.login-link{border:1px solid var(--gold);border-radius:9px;padding:10px 18px;color:var(--cream);text-decoration:none;font-weight:700}.login-link:hover{background:var(--gold);color:#171104}.hero{flex:1;display:grid;place-items:center;padding:60px 24px}.hero-card{max-width:760px;text-align:center;padding:clamp(28px,5vw,60px);background:rgba(12,11,8,.72);border:1px solid rgba(246,199,69,.25);border-radius:22px;box-shadow:0 25px 80px rgba(0,0,0,.5)}.eyebrow{color:var(--gold);letter-spacing:3px;text-transform:uppercase;font-size:12px;font-weight:700}.hero h1{font:700 clamp(38px,7vw,74px)/1.04 'Playfair Display',serif;margin:15px 0;color:var(--cream)}.hero p{color:var(--muted);font-size:17px;line-height:1.65;max-width:580px;margin:0 auto 30px}.actions{display:flex;justify-content:center;gap:14px;flex-wrap:wrap}.btn{padding:14px 22px;border-radius:10px;text-decoration:none;font-weight:700;min-width:180px}.primary{background:linear-gradient(135deg,#ffe080,var(--gold));color:#151105}.secondary{border:1px solid var(--gold);color:var(--cream);background:rgba(0,0,0,.25)}.primary:hover,.secondary:hover{transform:translateY(-2px)}.footer{text-align:center;padding:20px;color:#9d947f;font-size:13px}@media(max-width:560px){.top{padding:18px}.login-link{padding:9px 12px}.hero{padding:36px 16px}.hero-card{padding:34px 22px}.btn{width:100%}}
  </style>
</head>
<body>
  <header class="top"><div class="brand"><span class="brand-icon"></span><span>UNA PA' LA SED</span></div><a class="login-link" href="Vista/Login.jsp">Iniciar sesión</a></header>
  <main class="hero"><section class="hero-card"><div class="eyebrow">Licorería premium</div><h1>Tu brindis empieza aquí.</h1><p>Explora nuestro catálogo, administra tu crédito y compra tus productos favoritos de forma simple y segura.</p><div class="actions"><a class="btn primary" href="Vista/RegistroUsuario.jsp">Registrarme</a><a class="btn secondary" href="Vista/Login.jsp">Iniciar sesión</a></div></section></main>
  <footer class="footer">© 2026 Una Pa' La Sed · Solo para mayores de edad.</footer>
</body>
</html>
